name: Android CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Les valeurs Supabase sont volontairement vides en CI : l'app compile,
      # elle affichera simplement « boutique non configuree » a l'execution.
      - name: Build debug
        run: ./gradlew assembleDebug --no-daemon
